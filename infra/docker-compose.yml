services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mplanner
      POSTGRES_PASSWORD: mplanner
      POSTGRES_DB: mplanner
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mplanner -d mplanner"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
volumes:
  pgdata:
